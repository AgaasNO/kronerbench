name: Benchmark report
on:
  workflow_dispatch:
    inputs:
      release:
        description: Release containing report.tar.zst
        required: true
        default: budget-pilot-20260925
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download report artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_RELEASE: ${{ inputs.release }}
        run: gh release download "$REPORT_RELEASE" --pattern report.tar.zst --dir /tmp
      - name: Verify the reviewed report checksum
        env:
          REPORT_RELEASE: ${{ inputs.release }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          evidence = json.loads(pathlib.Path('results/pilot.json').read_text())
          assert evidence['release_tag'] == os.environ['REPORT_RELEASE']
          actual = hashlib.sha256(pathlib.Path('/tmp/report.tar.zst').read_bytes()).hexdigest()
          assert actual == evidence['report_sha256'], 'Report artifact checksum mismatch'
          assert evidence['total_cost_usd'] <= evidence['spending_cap_usd']
          assert evidence['scored_trial_fraction'] >= 0.95
          PY
      - run: mkdir -p reports/latest && tar --zstd -xf /tmp/report.tar.zst -C reports/latest
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reports/latest
      - id: deployment
        uses: actions/deploy-pages@v4
