[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kronerbench"
version = "0.1.0"
description = "Measure silent money errors in model tool calls."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["typer>=0.16", "httpx>=0.28", "pydantic>=2.11", "pyyaml>=6", "polars>=1.30", "pyarrow>=20", "numpy>=2", "scipy>=1.15", "rich>=14", "python-dotenv>=1", "jsonschema>=4.23"]

[project.scripts]
kronerbench = "kronerbench.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "hypothesis>=6", "ruff>=0.11", "mypy>=1.15", "types-PyYAML", "types-jsonschema", "scipy-stubs", "build"]

[tool.hatch.build.targets.wheel]
packages = ["src/kronerbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: paid contract tests, explicitly enabled with KRONERBENCH_LIVE=1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
files = ["src/kronerbench"]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["kronerbench.parsers.*", "kronerbench.scoring.*"]
strict = true
